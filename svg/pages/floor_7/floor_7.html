    <style>
        /* =====================================
   RESET
===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        .unit {
            fill: transparent;
            stroke: transparent;
            cursor: pointer;
            pointer-events: all;
            transition: .2s;
        }

        .unit:hover {
            fill: rgba(37, 99, 235, .35);
        }



        /* =====================================
   CONTAINER
===================================== */

        .floor-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* =====================================
   FLOOR IMAGE
===================================== */

        #floorImage {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            user-select: none;
            pointer-events: none;
        }

        /* =====================================
   SVG
===================================== */

        #floorSVG {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 10;
        }

        /* =====================================
   CLICKABLE AREAS
===================================== */

        #floorSVG path {

            fill: rgba(255, 255, 255, 0.001);

            stroke: transparent;

            stroke-width: 3;

            cursor: pointer;

            transition:
                fill .25s ease,
                stroke .25s ease,
                filter .25s ease,
                transform .25s ease;

        }

        /* =====================================
   HOVER
===================================== */

        #floorSVG path:hover {

            fill: rgba(255, 215, 0, .35);

            stroke: #FFD700;

            filter:
                drop-shadow(0 0 8px #FFD700) drop-shadow(0 0 20px #FFD700);

        }

        /* =====================================
   CLICK
===================================== */

        #floorSVG path:active {

            fill: rgba(255, 215, 0, .6);

        }
@media (max-width: 768px) and (orientation: portrait) {
    #floorNav,

        /* MOBILE LANDSCAPE */

            #floorNav,

            #popupContainer .card,

            }

            #popupContainer h2,

            #popupContainer input,

                padding: 9px 12px;
                margin-bottom: 9px;
                font-size: 16px;
            }

            #popupContainer button,
            .card button {
                padding: 10px;
                font-size: 15px;
            }

            .holdActions {
                gap: 10px;
                margin-top: 12px;
            }

            .secondaryBtn,
            .primaryBtn {
                padding: 10px 18px;
                font-size: 14px;
            }
        }

        /* VERY SHORT LANDSCAPE */
        @media (orientation: landscape) and (max-height: 380px) {

            .floor-container {
                padding: 26px 56px 6px 6px;
            }

            .back-btn {

                zoom: .7;
            }
