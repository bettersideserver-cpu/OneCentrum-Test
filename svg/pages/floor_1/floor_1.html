<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Floor 1</title>
    <link rel="stylesheet" href="../styles.css">


</head>

<body>
    <img id="floorImage" src="" alt="Floor">
    <script src="../../../js/floorLoader.js"></script>
    <style>
        /* =====================================
   RESET
===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =====================================
   CONTAINER
===================================== */

.floor-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}
        /* =====================================
   SHARED STAGE
   One box, ratio = SVG viewBox (4967 / 2341).
   The image and the SVG both fill this same box, so the
   clickable paths sit exactly on the drawing at every
   size, and the whole thing stays centred.
===================================== */

     .floor-stage {
    position: relative;
    width: 100%;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 4967 / 2341;
}

        /* =====================================
   FLOOR IMAGE
===================================== */

     #floorImage,
#floorSVG {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}
        #floorImage {
            object-fit: contain;

            user-select: none;
            pointer-events: none;
        }

        .unit {
            fill: transparent;
            stroke: transparent;
            cursor: pointer;
            pointer-events: all;
            transition: .2s;
        }

        .unit:hover {
            fill: rgba(37, 99, 235, .35);
        }



        /* =====================================
   SVG
===================================== */

        #floorSVG {
            z-index: 10;
        }

        /* =====================================
   CLICKABLE AREAS
===================================== */

        #floorSVG path {

            fill: rgba(255, 255, 255, 0.001);

            stroke: transparent;

            stroke-width: 3;

            cursor: pointer;

            transition:
                fill .25s ease,
                stroke .25s ease,
                filter .25s ease,
                transform .25s ease;

        }

        /* =====================================
   HOVER
===================================== */

        #floorSVG path:hover {

            fill: rgba(255, 215, 0, .35);

            stroke: #FFD700;

            filter:
                drop-shadow(0 0 8px #FFD700) drop-shadow(0 0 20px #FFD700);

        }

        /* =====================================
   CLICK
===================================== */

        #floorSVG path:active {

            fill: rgba(255, 215, 0, .6);

        }

        /* =====================================
   OPTIONAL BACK BUTTON
===================================== */

        .back-btn {

            position: absolute;

            top: 30px;
            left: 30px;

            padding: 12px 24px;

            background: white;

            color: black;

            text-decoration: none;

            border-radius: 10px;

            z-index: 100;

            font-weight: 600;

        }

        /* =====================================
   MOBILE LANDSCAPE
   Phone held sideways = short + wide viewport.
   Keyed on orientation + max-height because a phone in
   landscape is ~844px WIDE, so any (max-width:768px)
   rule never matches here.
===================================== */

        @media (orientation: landscape) and (max-height: 500px) {

            /* pad the container so the plan never slides under the
               floor-nav on the right or the header on top; the stage
               shrinks to fit and stays centred inside what's left */

               .floor-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

            header {
                position: relative;
                z-index: 120;
            }

            /* thicker strokes so the hit-highlight stays visible
               on a small screen */

            #floorSVG path {
                stroke-width: 5;
            }

            #floorSVG path:hover,
            #floorSVG path:active {
                fill: rgba(255, 215, 0, .4);
                stroke: #FFD700;
                filter: drop-shadow(0 0 6px #FFD700);
            }

            /* ---------- chrome trimmed down ---------- */

            header {
                padding: 5px 12px;
            }

            header h1 {
                font-size: 14px;
                margin-bottom: 0;
            }

            #legend {
                gap: 10px;
                font-size: 10px;
            }

            .back-btn {
                top: 2px;
                left: 8px;
                padding: 7px 3px;
                font-size: 2px;
                border-radius: 8px;
            }

            #timer {
                top:45px;
                right: 66px;
                padding: 6px 12px;
                font-size: 13px;
            }

            #tooltip {
                padding: 7px 10px;
                font-size: 11px;
                max-width: 55vw;
            }

            /* ---------- floor nav: compact, right edge ---------- */

        #floorNav,
.floor-nav,
#floorSelector,
.floor-switcher {
    position: fixed !important;
    top: 50% !important;
    right: 6px !important;
    left: auto !important;
    bottom: auto !important;
    transform: translateY(-50%) !important;
    z-index: 200 !important;
}
            /* ---------- hold / detail popups must fit 390px height ---------- */

            #popupContainer .card,
            #popupContainer .overlay > div,
            .card {
                width: min(420px, 92vw);
                max-height: 88vh;
                overflow-y: auto;
                padding: 16px 18px;
            }

            #popupContainer h2,
            .card h2 {
                font-size: 18px;
                margin-bottom: 10px;
            }

            #popupContainer input,
            .card input {
                padding: 9px 12px;
                margin-bottom: 9px;
                font-size: 16px;
            }

            #popupContainer button,
            .card button {
                padding: 10px;
                font-size: 15px;
            }

            .holdActions {
                gap: 10px;
                margin-top: 12px;
            }

            .secondaryBtn,
            .primaryBtn {
                padding: 10px 18px;
                font-size: 14px;
            }
        }

        /* very short landscape (small phones ~320px tall) */

        @media (orientation: landscape) and (max-height: 380px) {

            .floor-container {
                padding: 26px 56px 6px 6px;
            }

            .back-btn {
                padding: 6px 11px;
                font-size: 11px;
            }

            #floorNav,
            .floor-nav,
            #floorSelector,
            .floor-switcher {
                zoom: .7;
            }
        }

        /* =====================================
           MOBILE PORTRAIT ONLY
           Existing desktop + landscape styles remain unchanged.
        ===================================== */
@media (max-width: 768px) and (orientation: portrait) {
    #floorNav,
    .floor-nav,
    #floorSelector,
    .floor-switcher {
        position: fixed !important;
        top: auto !important;
        bottom: 20px !important;
        left: 50% !important;
        right: auto !important;
        transform: translateX(-50%) !important;
        z-index: 200 !important;
    }
}
        @media (max-width: 768px) and (orientation: portrait) {
            .floor-container {
                width: 100vw;
                height: 100vh;
                overflow: hidden;
            }

           .floor-stage {
    width: auto;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 4967 / 2341;
}

            header {
                padding: 10px 14px;
            }

            header h1 {
                font-size: 16px;
                margin-bottom: 5px;
            }

            #legend {
                gap: 10px;
                font-size: 11px;
                flex-wrap: wrap;
            }

            .back-btn {
                top: 8px;
                left: 8px;
                padding: 7px 13px;
                font-size: 12px;
                border-radius: 8px;
            }

            #tooltip {
                padding: 7px 10px;
                font-size: 11px;
                max-width: 80vw;
            }

            #timer {
                top: 52px;
                right: 8px;
                padding: 6px 12px;
                font-size: 13px;
            }

            #floorSVG path {
                stroke-width: 4;
            }

            #floorSVG path:active {
                fill: rgba(255, 215, 0, .45);
                stroke: #FFD700;
                filter: drop-shadow(0 0 6px #FFD700);
            }

            #popupContainer .card,
            #popupContainer .overlay > div,
            .card {
                width: min(420px, 92vw);
                max-height: 88vh;
                overflow-y: auto;
                padding: 16px 18px;
            }

            #popupContainer h2,
            .card h2 {
                font-size: 18px;
                margin-bottom: 10px;
            }

            #popupContainer input,
            .card input {
                padding: 9px 12px;
                margin-bottom: 9px;
                font-size: 16px;
            }

            #popupContainer button,
            .card button {
                padding: 10px;
                font-size: 15px;
            }

            .holdActions {
                gap: 10px;
                margin-top: 12px;
            }

            .secondaryBtn,
            .primaryBtn {
                padding: 10px 18px;
                font-size: 14px;
            }
        }

/* ==========================================
   PORTRAIT MOBILE - CENTER FLOOR IMAGE
========================================== */

@media screen and (max-width: 768px) and (orientation: portrait) {

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    .floor-container {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100dvh !important;
        overflow: hidden !important;
    }

    #floorImage,
    #floorSVG {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
    }

    #floorImage {
        object-fit: contain !important;
        object-position: center center !important;
    }

    #floorSVG {
        z-index: 10;
    }

    header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 120;
    }
}
header h1 {
    display: none !important;
}
    </style>


    <header>
        <h1>Interactive Floor Plan</h1>
        <div id="legend"></div>
    </header>
    <div id="timer">
        00:00
    </div>
    <div id="tooltip"></div>
    <div class="floor-container">

        <div class="floor-stage">

        <!-- Floor Plan Image -->
        <img src="Floor-01.png" id="floorImage" alt="Floor Plan">

        <!-- SVG Overlay -->
        <svg id="floorSVG" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4967 2341"
            preserveAspectRatio="xMidYMid meet">

            <path id="1_AnchorStore_01" class="unit"
                d="m2102.61 871.63.19-94.09-1053.72-2.08-1.5 764.21 972.43 1.92.88-445.68-451.68-.89.1-46.31-207.26-.41.35-178.71z"
                class="st0" />

            <path id="1_Retail_Area_01" class="unit"

            <path id="1_Retail_Area_02" class="unit"

            <path id="1_Retail_Area_03" class="unit"

                class="st0" />

        </svg>

        </div>

    </div>


    <script>
        window.unitDetails = {
            "1_AnchorStore_01": {
                unit: "Anchor Store 01",

            },

            "1_Retail_Area_02": {
                unit: "Retail Area 02",

            },

            "1_Retail_Area_03": {
                unit: "Retail Area 03",

            }
        };
    </script>

    <div id="popupContainer"></div>

    <script>
        fetch("../hold.html")
            .then(r => r.text())
            .then(html => {

                document.getElementById("popupContainer").innerHTML = html;

            });
    </script>

    <script type="module" src="../../../js/database.js"></script>

    <script type="module" src="../../../js/visitor.js"></script>


    <script src="../floor-nav.js"></script>
</body>

</html>
