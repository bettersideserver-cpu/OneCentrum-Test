<style>

.overlay{

    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.55);

    z-index:99999;

}

.card{

    width:420px;

    background:#fff;

    border-radius:14px;

    padding:30px;

    text-align:center;

    box-shadow:0 20px 50px rgba(0,0,0,.25);

}

.card h2{

    margin-bottom:15px;

}

.holdActions{

    display:flex;

    justify-content:center;

    gap:15px;

    margin-top:25px;

}

.holdActions button{

    padding:12px 28px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:15px;

    font-weight:600;

}

#holdNo{

    background:#f3f4f6;

    color:#111827;

}

#holdYes{

    background:#2563eb;

    color:#fff;

}

#holdYes:hover{

    background:#1d4ed8;

}

#holdNo:hover{

    background:#d1d5db;

}

</style>


<div id="holdPopup" class="overlay" style="display:none">

    <div class="card">

        <h2>Property Hold Request</h2>

        <p id="holdPropertyName"></p>

        <br>

        <p>Do you want to hold this property?</p>

        <div class="holdActions">

            <button id="holdNo">No</button>

            <button id="holdYes">Yes</button>

        </div>

    </div>

</div>
