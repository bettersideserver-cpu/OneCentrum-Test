<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            position: relative;
        }

        /* Background Logo */
        .background-logo {
            position: absolute;
            width: 65vw;
            max-width: 900px;
            min-width: 350px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            opacity: 0.13;
            filter: blur(2px);

            z-index: 1;

            pointer-events: none;
            user-select: none;
        }

        /* Dark overlay */
        .overlay {
            position: absolute;
            inset: 0;

            background:
                radial-gradient(circle at center,
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.75));

            z-index: 2;
        }

        /* Main Content */
        .content {
            position: relative;
            z-index: 3;

            text-align: center;
            color: white;
        }

        .coming-soon {
            font-size: clamp(55px, 9vw, 150px);
            font-weight: 800;
            letter-spacing: 0.08em;
            line-height: 1;

            text-transform: uppercase;

            text-shadow:
                0 5px 30px rgba(0, 0, 0, 0.8);

            animation: fadeIn 1.5s ease forwards;
        }

        /* Small line underneath */
        .line {
            width: 80px;
            height: 2px;

            background: white;

            margin: 30px auto 0;

            opacity: 0.7;

            animation: expandLine 1.5s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes expandLine {
            from {
                width: 0;
                opacity: 0;
            }

            to {
                width: 80px;
                opacity: 0.7;
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .background-logo {
                width: 100vw;
                opacity: 0.1;
                filter: blur(6px);
            }

            .coming-soon {
                font-size: 15vw;
                letter-spacing: 0.05em;
            }
        }
    </style>
</head>

<body>

    <!-- Background Logo -->
    <img src="assets/company-logo.png" alt="" class="background-logo">

    <!-- Dark Overlay -->
    <div class="overlay"></div>

    <!-- Main Text -->
    <main class="content">
        <h1 class="coming-soon">Coming Soon</h1>
        <div class="line"></div>
    </main>

</body>

</html>
